name: Endpunkte prüfen (Modelle & kostenlose KI)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-endpoints.yml'
      - 'www/js/models.js'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Modell-Downloads (Hugging Face) prüfen
        run: |
          set +e
          node -e "
            global.window = {};
            require('./www/js/models.js');
            for (const m of window.ModelCatalog.list) console.log(m.url);
          " > urls.txt || true
          cat urls.txt
          while read -r url; do
            [ -z "$url" ] && continue
            code=$(curl -sIL -o /dev/null -w '%{http_code}' "$url")
            size=$(curl -sIL "$url" | grep -i '^content-length' | tail -1 | tr -d '\r' | awk '{print $2}')
            cors=$(curl -sIL -H 'Origin: https://localhost' "$url" | grep -i '^access-control-allow-origin' | tail -1 | tr -d '\r')
            echo "RESULT $code size=$size [$cors] $url"
          done < urls.txt

      - name: Kostenlose Online-KI (Pollinations) prüfen
        run: |
          set +e
          echo "--- GET text.pollinations.ai/models"
          curl -s -m 30 -w '\nHTTP %{http_code}\n' https://text.pollinations.ai/models | head -c 3000
          echo
          echo "--- POST text.pollinations.ai/openai (stream)"
          curl -s -m 60 -N -w '\nHTTP %{http_code}\n' -H 'Content-Type: application/json' -H 'Origin: https://localhost' \
            -d '{"model":"openai","stream":true,"messages":[{"role":"user","content":"Sag nur: Hallo"}]}' \
            https://text.pollinations.ai/openai | head -c 3000
          echo
          echo "--- CORS-Header"
          curl -s -m 30 -D - -o /dev/null -X OPTIONS -H 'Origin: https://localhost' -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' https://text.pollinations.ai/openai
          echo "--- Bild"
          curl -s -m 90 -L -o img.jpg -w 'HTTP %{http_code} type=%{content_type} bytes=%{size_download}\n' \
            'https://image.pollinations.ai/prompt/a%20red%20apple?width=256&height=256&nologo=true'

      - name: API-Anbieter für eigene Schlüssel prüfen (ohne Schlüssel -> 401 erwartet)
        run: |
          set +e
          for base in \
            https://api.openai.com/v1 \
            https://generativelanguage.googleapis.com/v1beta/openai \
            https://api.mistral.ai/v1 \
            https://api.groq.com/openai/v1 \
            https://openrouter.ai/api/v1 \
            https://api.deepseek.com/v1 \
            https://api.x.ai/v1 ; do
            code=$(curl -s -m 20 -o body.txt -w '%{http_code}' "$base/models")
            cors=$(curl -s -m 20 -D - -o /dev/null -X OPTIONS -H 'Origin: https://localhost' -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: authorization,content-type' "$base/chat/completions" | grep -i '^access-control-allow-origin' | tr -d '\r')
            echo "API $code [$cors] $base :: $(head -c 160 body.txt | tr '\n' ' ')"
          done
          code=$(curl -s -m 20 -o /dev/null -w '%{http_code}' https://api.anthropic.com/v1/models)
          echo "API $code https://api.anthropic.com/v1/models"

      - name: Seiten zum Erstellen von API-Schlüsseln prüfen
        run: |
          set +e
          for u in \
            https://platform.openai.com/api-keys \
            https://aistudio.google.com/apikey \
            https://console.mistral.ai/api-keys \
            https://console.groq.com/keys \
            https://openrouter.ai/keys \
            https://platform.deepseek.com/api_keys \
            https://console.x.ai \
            https://console.anthropic.com/settings/keys \
            https://ollama.com/download \
            https://lmstudio.ai ; do
            echo "PAGE $(curl -s -m 20 -L -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0' "$u") $u"
          done

      - name: Google Gemini (OpenAI-kompatibel) genauer prüfen
        run: |
          set +e
          for base in https://generativelanguage.googleapis.com/v1beta/openai https://generativelanguage.googleapis.com/v1beta/openai/ ; do
            echo "--- POST $base/chat/completions"
            curl -s -m 20 -w '\nHTTP %{http_code}\n' -H 'Content-Type: application/json' -H 'Authorization: Bearer ungueltig' \
              -d '{"model":"gemini-2.0-flash","messages":[{"role":"user","content":"hi"}]}' "${base%/}/chat/completions" | head -c 600
            echo "--- GET $base/models (ungültiger Schlüssel)"
            curl -s -m 20 -w '\nHTTP %{http_code}\n' -H 'Authorization: Bearer ungueltig' "${base%/}/models" | head -c 400
          done

